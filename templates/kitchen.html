<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keukenscherm - Bestellingen Overzicht</title>
    <style>
        body { 
            background-color: #0f172a; /* Deep slate dark-mode */
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0;
            padding: 4vh 4vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .kitchen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #1e293b;
            transition: border-color 0.3s ease;
        }

        .kitchen-header h1 {
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            color: #38bdf8;
            margin: 0;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            align-items: center;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
        }

        .header-stats .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-stats .stat-value {
            color: #38bdf8;
            font-weight: 800;
        }

        .grid-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .grid-controls label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-controls select {
            background: #1e293b;
            border: 2px solid #334155;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .grid-controls select:hover {
            border-color: #38bdf8;
        }

        .grid-controls select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .theme-toggle-btn {
            position: relative;
            width: 52px;
            height: 26px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 26px;
            cursor: pointer;
            transition: background 0.25s ease, border-color 0.25s ease;
            padding: 0;
            outline: none;
        }
        .theme-toggle-btn::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #94a3b8;
            transition: transform 0.25s ease, background 0.25s ease;
        }
        .theme-toggle-btn.on {
            background: #0e7490;
            border-color: #06b6d4;
        }
        .theme-toggle-btn.on::after {
            transform: translateX(26px);
            background: #ffffff;
        }
        .theme-toggle-btn:hover { border-color: #38bdf8; }
        .theme-icon { font-size: 14px; line-height: 1; }

        .undo-btn {
            background: #312e81;
            border: 1px solid #3730a3;
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .undo-btn:hover {
            background: #3730a3;
            color: white;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .orders-grid {
            flex: 1;
            display: grid;
            gap: 16px;
            /* Columns and rows are set via CSS variables from JS */
            grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr));
            grid-template-rows: repeat(var(--rows, 2), minmax(0, 1fr));
            min-height: 0;
        }

        /* Modern chip formatting derived from bingosoft */
        .order-chip {
            background: #1e293b;
            border: 3px solid #334155;
            font-weight: 800;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 10px;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
            min-height: 0;
        }

        .order-chip:hover {
            transform: scale(1.02);
            border-color: #38bdf8;
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.2);
        }

        .order-chip:active {
            transform: scale(0.98);
        }

        .order-chip.preparing {
            color: #cbd5e1;
        }

        /* Order number pinned to the top-middle of the box */
        .order-chip .order-number {
            word-break: break-word;
            line-height: 1.1;
            font-size: calc(4rem * var(--order-scale, 1));
            margin-top: 6px;
        }

        /* Faint divider line below the order number */
        .order-chip .order-divider {
            width: 100%;
            border-top: 1px solid rgba(148, 163, 184, 0.35);
            margin: 8px 0;
        }

        .order-chip .order-details {
            font-size: calc(1.3rem * var(--order-scale, 1));
            color: #a0aec0;
            line-height: 1.3;
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
        }

        .order-chip .order-details::-webkit-scrollbar {
            width: 6px;
        }
        .order-chip .order-details::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        body.light-theme .order-chip .order-details::-webkit-scrollbar-thumb {
            background: #94a3b8;
        }

        .order-chip .item-row {
            text-align: left;
            padding: 2px 0;
            font-weight: 600;
            color: #cbd5e1;
        }

        .order-chip .item-row.muted {
            color: #64748b;
            font-weight: 500;
        }

        .order-chip .item-qty {
            color: #38bdf8;
            font-weight: 800;
            margin-right: 5px;
        }

        /* FIFO direction arrows on the first (oldest) and last (newest) order */
        .fifo-arrow {
            position: absolute;
            font-size: calc(2.4rem * var(--order-scale, 1));
            font-weight: 900;
            color: #38bdf8;
            line-height: 1;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
            z-index: 5;
            pointer-events: none;
        }

        .order-chip.fifo-first .fifo-arrow {
            top: 6px;
            left: 8px;
        }

        .order-chip.fifo-last .fifo-arrow {
            bottom: 6px;
            right: 8px;
        }

        body.light-theme .fifo-arrow {
            color: #0284c7;
            text-shadow: 0 0 12px rgba(2, 132, 199, 0.3);
        }

        .empty-state {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            text-align: center;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.2rem;
            font-weight: 500;
            margin: 0;
        }

        /* ================= LIGHT MODE OVERRIDES ================= */
        body.light-theme {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.light-theme .kitchen-header {
            border-bottom-color: #cbd5e1;
        }
        body.light-theme .kitchen-header h1 { color: #0284c7; }
        body.light-theme .grid-controls label { color: #64748b; }
        body.light-theme .header-stats { color: #64748b; }
        body.light-theme .header-stats .stat-value { color: #0284c7; }
        
        body.light-theme .grid-controls select {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #0f172a;
        }
        body.light-theme .grid-controls select:hover {
            border-color: #0284c7;
        }
        body.light-theme .grid-controls select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        body.light-theme .theme-toggle-btn {
            background: #cbd5e1;
            border-color: #94a3b8;
        }
        body.light-theme .theme-toggle-btn::after {
            background: #f8fafc;
        }
        body.light-theme .theme-toggle-btn.on {
            background: #0284c7;
            border-color: #0ea5e9;
        }
        body.light-theme .theme-toggle-btn.on::after {
            background: #ffffff;
        }
        body.light-theme .theme-toggle-btn:hover {
            border-color: #0284c7;
        }

        body.light-theme .undo-btn {
            background-color: #e0e7ff;
            border-color: #c7d2fe;
            color: #3730a3;
        }
        body.light-theme .undo-btn:hover {
            background-color: #c7d2fe;
            color: #1e1b4b;
        }

        body.light-theme .order-chip {
            background: #ffffff;
            border-color: #cbd5e1;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }
        body.light-theme .order-chip:hover {
            border-color: #0284c7;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.15);
        }
        body.light-theme .order-chip.preparing {
            color: #334155;
        }
        body.light-theme .order-chip .order-divider {
            border-top-color: rgba(100, 116, 139, 0.35);
        }
        body.light-theme .order-chip .item-row {
            color: #334155;
        }
        body.light-theme .order-chip .item-qty {
            color: #0284c7;
        }
        body.light-theme .empty-state {
            color: #94a3b8;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header class="kitchen-header">
        <h1>Keuken Overzicht</h1>
        <div class="header-stats">
            <div class="stat">In de keuken: <span class="stat-value" id="preparingCount">0</span></div>
            <div class="stat">In wachtrij: <span class="stat-value" id="queuedCount">0</span></div>
            <div class="grid-controls">
                <label for="gridRows">Rijen:</label>
                <select id="gridRows">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
                <label for="gridColumns">Kolommen:</label>
                <select id="gridColumns">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" selected>5</option>
                    <option value="6">6</option>
                </select>
                <span class="theme-icon" id="localThemeIcon">☾</span>
                <button onclick="toggleLocalTheme()" id="localThemeBtn" class="theme-toggle-btn" aria-label="Thema"></button>
                <button onclick="undoCompletion()" id="undoButton" class="undo-btn">↩ Ongedaan maken</button>
            </div>
        </div>
    </header>

    <main>
        <div class="orders-grid" id="ordersGrid">
            <div class="empty-state" id="emptyState">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
                <p>Geen bestellingen</p>
            </div>
        </div>
    </main>

    <script>
        const ordersGrid = document.getElementById('ordersGrid');
        const emptyState = document.getElementById('emptyState');
        const gridRowsSelect = document.getElementById('gridRows');
        const gridColumnsSelect = document.getElementById('gridColumns');
        const preparingCount = document.getElementById('preparingCount');
        const queuedCount = document.getElementById('queuedCount');

        const undoButton = document.getElementById('undoButton');

        let lastStateString = "";

        // Local kitchen theme (independent of the display theme)
        const savedLocalTheme = localStorage.getItem('kitchen_theme') || 'dark';
        document.body.classList.toggle('light-theme', savedLocalTheme === 'light');
        document.getElementById('localThemeBtn').classList.toggle('on', savedLocalTheme === 'light');
        updateThemeIcon(savedLocalTheme === 'light');

        function updateThemeIcon(isLight) {
            document.getElementById('localThemeIcon').textContent = isLight ? '☀' : '☾';
        }

        function toggleLocalTheme() {
            const isLight = document.body.classList.contains('light-theme');
            const target = isLight ? 'dark' : 'light';
            document.body.classList.toggle('light-theme', target === 'light');
            localStorage.setItem('kitchen_theme', target);
            document.getElementById('localThemeBtn').classList.toggle('on', target === 'light');
            updateThemeIcon(target === 'light');
        }

        // Load saved grid preference (rows + columns)
        const savedRows = localStorage.getItem('kitchenGridRows') || '2';
        const savedColumns = localStorage.getItem('kitchenGridColumns') || '5';
        gridRowsSelect.value = savedRows;
        gridColumnsSelect.value = savedColumns;
        applyGrid();

        gridRowsSelect.addEventListener('change', () => {
            localStorage.setItem('kitchenGridRows', gridRowsSelect.value);
            applyGrid();
        });

        gridColumnsSelect.addEventListener('change', () => {
            localStorage.setItem('kitchenGridColumns', gridColumnsSelect.value);
            applyGrid();
        });

        // Apply the grid dimensions and sync kitchen capacity to rows * columns
        async function applyGrid() {
            const rows = parseInt(gridRowsSelect.value, 10);
            const cols = parseInt(gridColumnsSelect.value, 10);
            ordersGrid.style.setProperty('--rows', rows);
            ordersGrid.style.setProperty('--cols', cols);

            // Recompute the text scale based on the new grid capacity
            updateScale(rows * cols);

            // Keep the kitchen capacity in sync with the visible grid slots
            const capacity = rows * cols;
            try {
                await fetch('/api/kitchen/capacity', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ capacity })
                });
            } catch (e) {
                console.error("Failed to sync kitchen capacity", e);
            }
        }

        // Scale the text based on how many orders fit on screen (grid capacity).
        // Fewer slots -> bigger text; more slots -> smaller text.
        function updateScale(slots) {
            let scale;
            if (slots <= 4) scale = 1.4;
            else if (slots <= 6) scale = 1.2;
            else if (slots <= 10) scale = 1;
            else if (slots <= 16) scale = 0.8;
            else scale = 0.65;
            ordersGrid.style.setProperty('--order-scale', scale);
        }

        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const data = await res.json();

                // Track state changes to avoid unnecessary DOM refreshes
                const currentStateString = JSON.stringify({
                    p: data.preparing
                });

                if (currentStateString !== lastStateString) {
                    preparingCount.textContent = data.preparing.length;
                    queuedCount.textContent = data.queued.length;

                    renderOrders(data.preparing);
                    lastStateString = currentStateString;
                }
            } catch (error) {
                console.error("Connection lost...");
            }
        }

        function renderOrders(orders) {
            if (orders.length === 0) {
                ordersGrid.innerHTML = '';
                ordersGrid.appendChild(emptyState);
                emptyState.style.display = 'flex';
                return;
            }

            emptyState.style.display = 'none';
            ordersGrid.innerHTML = '';

            orders.forEach((order, index) => {
                const number = order.order || '?';
                const items = order.items || [];

                const div = document.createElement('div');
                div.className = 'order-chip preparing';
                div.dataset.order = number;

                // Mark the oldest (first) and newest (last) order with FIFO arrows
                if (index === 0) {
                    div.classList.add('fifo-first');
                }
                if (index === orders.length - 1) {
                    div.classList.add('fifo-last');
                }

                let itemsHtml = '';
                if (items.length > 0) {
                    itemsHtml = items.map(i =>
                        `<div class="item-row"><span class="item-qty">${i.qty}×</span> ${i.name}</div>`
                    ).join('');
                } else {
                    itemsHtml = '<div class="item-row muted">Geen items</div>';
                }

                div.innerHTML = `
                    <span class="order-number">${number}</span>
                    <div class="order-divider"></div>
                    <div class="order-details">
                        ${itemsHtml}
                    </div>
                    ${index === 0 ? '<span class="fifo-arrow">←</span>' : ''}
                    ${index === orders.length - 1 ? '<span class="fifo-arrow">←</span>' : ''}
                `;

                // Tap to complete the order immediately
                div.addEventListener('click', () => completeOrder(div, number));

                ordersGrid.appendChild(div);
            });
        }

        async function completeOrder(element, orderId) {
            try {
                const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/done`, {
                    method: 'PUT'
                });
                if (!res.ok) {
                    throw new Error('Failed to complete order');
                }
                // The next fetch cycle removes the order and promotes the next queued one
            } catch (error) {
                console.error("Failed to complete order:", error);
            }
        }

        async function undoCompletion() {
            try {
                const res = await fetch('/api/undo', { method: 'POST' });
                if (!res.ok) {
                    throw new Error('Failed to undo');
                }
                // The next fetch cycle restores the last order
            } catch (error) {
                console.error("Failed to undo completion:", error);
            }
        }

        undoButton.addEventListener('click', undoCompletion);

        setInterval(fetchOrders, 1000);
        fetchOrders();
    </script>
</body>
</html>
