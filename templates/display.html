<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klantenscherm - Status Overzicht</title>
    <style>
        body { 
            background-color: #0f172a; /* Deep slate dark-mode */
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0;
            padding: 5vh 5vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .display-container {
            display: flex;
            flex: 1;
            gap: 5vw;
            overflow: hidden;
        }

        .column {
            display: flex;
            flex-direction: column;
        }

        .preparing-column {
            flex: 1;
            border-right: 2px solid #1e293b;
            padding-right: 2vw;
            transition: border-color 0.3s ease;
        }

        .ready-column {
            flex: 2.5;
        }

        h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-weight: 700;
        }
        .preparing-column h1 { color: #64748b; }
        .ready-column h1 { color: #38bdf8; } /* Glowing cyan theme color */

        .grid-container {
            display: grid;
            gap: 20px;
            align-content: start;
        }

        .preparing-grid {
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        }

        .ready-grid {
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }
        
        /* Modern chip formatting derived from bingosoft */
        .order-chip {
            background: #1e293b;
            border: 2px solid #334155;
            font-weight: 800;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: all 0.3s ease;
            box-sizing: border-box;
            overflow: hidden;
            word-break: break-word;
            white-space: normal;
        }

        .order-chip.preparing {
            color: #cbd5e1;
            font-size: 2.5rem;
            padding: 12px 10px;
        }

        .order-chip.ready {
            color: #ffffff;
            font-size: 6rem;
            padding: 15px 10px;
            border-color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.15);
        }

        /* ================= LIGHT MODE OVERRIDES ================= */
        body.light-theme {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.light-theme .preparing-column {
            border-right-color: #cbd5e1;
        }
        body.light-theme .preparing-column h1 { color: #94a3b8; }
        body.light-theme .ready-column h1 { color: #0284c7; }
        
        body.light-theme .order-chip {
            background: #ffffff;
            border-color: #cbd5e1;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }
        body.light-theme .order-chip.preparing {
            color: #334155;
        }
        body.light-theme .order-chip.ready {
            color: #0f172a;
            border-color: #0284c7;
            text-shadow: none;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="display-container">
        <!-- PREPARING SECTION -->
        <div class="column preparing-column">
            <h1>Wordt gemaakt</h1>
            <div class="grid-container preparing-grid" id="preparingGrid"></div>
        </div>

        <!-- READY SECTION -->
        <div class="column ready-column">
            <h1>Klaar om op te halen</h1>
            <div class="grid-container ready-grid" id="readyGrid"></div>
        </div>
    </div>

    <script>
        const preparingGrid = document.getElementById('preparingGrid');
        const readyGrid = document.getElementById('readyGrid');
        let lastStateString = "";

        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const data = await res.json();
                
                // Track state changes to avoid unnecessary DOM refreshes
                const currentStateString = JSON.stringify({
                    p: data.pending, 
                    r: data.done, 
                    t: data.display_theme
                });
                
                if (currentStateString !== lastStateString) {
                    // Update remote synchronization theme
                    document.body.classList.toggle('light-theme', data.display_theme === 'light');
                    
                    // Render pending list (being made)
                    preparingGrid.innerHTML = '';
                    (data.pending || []).forEach(order => {
                        const div = document.createElement('div');
                        div.className = 'order-chip preparing';
                        div.textContent = order.order || order;
                        preparingGrid.appendChild(div);
                    });

                    // Render done (ready for pickup) list
                    readyGrid.innerHTML = '';
                    (data.done || []).forEach(order => {
                        const div = document.createElement('div');
                        div.className = 'order-chip ready';
                        div.textContent = order.order || order;
                        readyGrid.appendChild(div);
                    });

                    lastStateString = currentStateString;
                }
            } catch (error) {
                console.error("Connection lost...");
            }
        }

        setInterval(fetchOrders, 1000);
        fetchOrders();
    </script>
</body>
</html>
