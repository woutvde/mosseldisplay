<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klantenscherm - Status Overzicht</title>
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            background-color: black;
            color: white;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .display-container {
            display: flex;
            flex: 1;
            gap: 50px;
            overflow: hidden;
        }
        .column {
            display: flex;
            flex-direction: column;
        }
        /* Smaller columns for items being prepared */
        .preparing-column {
            flex: 1;
            border-right: 3px dashed #222;
            padding-right: 30px;
        }
        /* Dominant screen ratio space for finished items */
        .ready-column {
            flex: 3;
        }
        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .preparing-column h1 { color: #ff9933; }
        .ready-column h1 { color: #00ff00; }

        .grid-container {
            display: grid;
            gap: 20px;
            align-content: start;
        }
        .preparing-grid {
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        }
        .ready-grid {
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
        }
        
        .order-number {
            font-weight: bold;
            text-align: center;
            background-color: #111;
            border-radius: 15px;
            box-sizing: border-box;
        }
        /* Intentionally sized smaller */
        .order-number.preparing {
            color: #ffaa66;
            font-size: 3.5rem;
            padding: 15px;
            border: 2px solid #331f0c;
        }
        /* Intentionally sized bigger with highlight accents */
        .order-number.ready {
            color: yellow;
            font-size: 7rem;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 255, 0, 0.12);
            border: 2px solid #333300;
        }
    </style>
</head>
<body>

    <div class="display-container">
        <div class="column preparing-column">
            <h1>Wordt gemaakt</h1>
            <div class="grid-container preparing-grid" id="preparingGrid"></div>
        </div>

        <div class="column ready-column">
            <h1>Klaar om op te halen</h1>
            <div class="grid-container ready-grid" id="readyGrid"></div>
        </div>
    </div>

    <script>
        const preparingGrid = document.getElementById('preparingGrid');
        const readyGrid = document.getElementById('readyGrid');
        let lastStateString = "";

        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const data = await res.json();
                
                const currentStateString = JSON.stringify({p: data.preparing, r: data.ready});
                
                if (currentStateString !== lastStateString) {
                    // Update Preparing Grid UI
                    preparingGrid.innerHTML = '';
                    data.preparing.forEach(order => {
                        const div = document.createElement('div');
                        div.className = 'order-number preparing';
                        div.textContent = order;
                        preparingGrid.appendChild(div);
                    });

                    // Update Ready Grid UI
                    readyGrid.innerHTML = '';
                    data.ready.forEach(order => {
                        const div = document.createElement('div');
                        div.className = 'order-number ready';
                        div.textContent = order;
                        readyGrid.appendChild(div);
                    });

                    lastStateString = currentStateString;
                }
            } catch (error) {
                console.error("Connection lost...");
            }
        }

        setInterval(fetchOrders, 2000);
        fetchOrders();
    </script>
</body>
</html>
