<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personeel Invoer - Bestellingen Tracker</title>
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        .left-panel {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .right-panel {
            width: 450px;
            background-color: #e8e8e8;
            border-left: 2px solid #ccc;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { font-size: 2rem; color: #333; }
        
        /* Numpad & Input */
        #orderInput {
            font-size: 4rem;
            text-align: center;
            width: 100%;
            margin-bottom: 30px;
            padding: 10px;
            box-sizing: border-box;
        }
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }
        .btn {
            font-size: 2.5rem;
            font-weight: bold;
            padding: 25px 0;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
        }
        .btn:active { background-color: #ddd; }
        .btn-clear { background-color: #ff9999; }
        .btn-enter { background-color: #99ff99; }
        
        /* Active Orders Grid */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .order-btn {
            background-color: #ffcccc;
            font-size: 2.5rem;
            font-weight: bold;
            padding: 30px 10px;
            border: 1px solid #c99;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .order-btn:hover { background-color: #ffb3b3; }
    </style>
</head>
<body>

    <div class="left-panel">
        <h2>Klik op een bestelnummer om het te verwijderen:</h2>
        <div class="orders-grid" id="activeOrders"></div>
    </div>

    <div class="right-panel">
        <h2>Nieuwe Bestelling:</h2>
        <input type="text" id="orderInput" readonly>
        
        <div class="numpad">
            <button class="btn" onclick="appendNum('7')">7</button>
            <button class="btn" onclick="appendNum('8')">8</button>
            <button class="btn" onclick="appendNum('9')">9</button>
            <button class="btn" onclick="appendNum('4')">4</button>
            <button class="btn" onclick="appendNum('5')">5</button>
            <button class="btn" onclick="appendNum('6')">6</button>
            <button class="btn" onclick="appendNum('1')">1</button>
            <button class="btn" onclick="appendNum('2')">2</button>
            <button class="btn" onclick="appendNum('3')">3</button>
            <button class="btn btn-clear" onclick="clearInput()">C</button>
            <button class="btn" onclick="appendNum('0')">0</button>
            <button class="btn btn-enter" onclick="submitOrder()">Enter</button>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('orderInput');
        const ordersGrid = document.getElementById('activeOrders');

        function appendNum(num) { inputField.value += num; }
        function clearInput() { inputField.value = ''; }

        // Allow physical keyboard entry
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNum(e.key);
            if (e.key === 'Backspace') inputField.value = inputField.value.slice(0, -1);
            if (e.key === 'Enter') submitOrder();
            if (e.key === 'Escape' || e.key.toLowerCase() === 'c') clearInput();
        });

        async function submitOrder() {
            const orderNum = inputField.value.trim();
            if (!orderNum) return;
            
            await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order: orderNum })
            });
            
            clearInput();
            fetchOrders(); // Immediately update UI
        }

        async function removeOrder(orderNum) {
            await fetch(`/api/orders/${orderNum}`, { method: 'DELETE' });
            fetchOrders(); // Immediately update UI
        }

        async function fetchOrders() {
            const res = await fetch('/api/orders');
            const orders = await res.json();
            
            ordersGrid.innerHTML = '';
            orders.forEach(order => {
                const btn = document.createElement('button');
                btn.className = 'order-btn';
                btn.textContent = order;
                btn.onclick = () => removeOrder(order);
                ordersGrid.appendChild(btn);
            });
        }

        // Poll for updates every 2 seconds (keeps multiple staff screens in sync)
        setInterval(fetchOrders, 2000);
        fetchOrders();
    </script>
</body>
</html>
