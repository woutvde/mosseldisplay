<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personeel Invoer - Bestellingen Tracker</title>
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        .left-panel {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            gap: 40px;
        }
        .column-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .right-panel {
            width: 450px;
            background-color: #e8e8e8;
            border-left: 2px solid #ccc;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        h2 { font-size: 1.8rem; color: #333; margin-top: 0; }
        
        /* Numpad & Input */
        #orderInput {
            font-size: 4rem;
            text-align: center;
            width: 100%;
            margin-bottom: 30px;
            padding: 10px;
            box-sizing: border-box;
        }
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }
        .btn {
            font-size: 2.5rem;
            font-weight: bold;
            padding: 25px 0;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
        }
        .btn:active { background-color: #ddd; }
        .btn-clear { background-color: #ff9999; }
        .btn-enter { background-color: #99ff99; }
        
        /* Active Orders Grid Setup */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        .order-btn {
            font-size: 2rem;
            font-weight: bold;
            padding: 20px 10px;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        .preparing-btn {
            background-color: #ffe6cc;
            border-color: #f9c29d;
            color: #b35c00;
        }
        .preparing-btn:hover { background-color: #ffd8b3; }
        
        .ready-btn {
            background-color: #ccffcc;
            border-color: #99ff99;
            color: #006600;
        }
        .ready-btn:hover { background-color: #b3ffb3; }

        /* POS Blockout Layer */
        .pos-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(220, 220, 220, 0.92);
            color: #555;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 30px;
            box-sizing: border-box;
            border-left: 1px solid #bbb;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="column-section">
            <h2>Wordt gemaakt:</h2>
            <div class="orders-grid" id="preparingOrders"></div>
        </div>
        <div class="column-section">
            <h2>Klaar voor afhalen:</h2>
            <div class="orders-grid" id="readyOrders"></div>
        </div>
    </div>

    <div class="right-panel">
        <!-- Overlay container elements for POS locks -->
        <div class="pos-overlay" id="posOverlay">verbonden aan mosselpos</div>
        
        <h2>Nieuwe Bestelling:</h2>
        <input type="text" id="orderInput" readonly>
        
        <div class="numpad">
            <button class="btn" onclick="appendNum('7')">7</button>
            <button class="btn" onclick="appendNum('8')">8</button>
            <button class="btn" onclick="appendNum('9')">9</button>
            <button class="btn" onclick="appendNum('4')">4</button>
            <button class="btn" onclick="appendNum('5')">5</button>
            <button class="btn" onclick="appendNum('6')">6</button>
            <button class="btn" onclick="appendNum('1')">1</button>
            <button class="btn" onclick="appendNum('2')">2</button>
            <button class="btn" onclick="appendNum('3')">3</button>
            <button class="btn btn-clear" onclick="clearInput()">C</button>
            <button class="btn" onclick="appendNum('0')">0</button>
            <button class="btn btn-enter" onclick="submitOrder()">Enter</button>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('orderInput');
        const preparingGrid = document.getElementById('preparingOrders');
        const readyGrid = document.getElementById('readyOrders');
        const posOverlay = document.getElementById('posOverlay');
        let isPosConnected = false;

        function appendNum(num) { 
            if (isPosConnected) return;
            inputField.value += num; 
        }
        function clearInput() { 
            if (isPosConnected) return;
            inputField.value = ''; 
        }

        document.addEventListener('keydown', (e) => {
            if (isPosConnected) return;
            if (e.key >= '0' && e.key <= '9') appendNum(e.key);
            if (e.key === 'Backspace') inputField.value = inputField.value.slice(0, -1);
            if (e.key === 'Enter') submitOrder();
            if (e.key === 'Escape' || e.key.toLowerCase() === 'c') clearInput();
        });

        async function submitOrder() {
            if (isPosConnected) return;
            const orderNum = inputField.value.trim();
            if (!orderNum) return;
            
            await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order: orderNum, status: 'preparing' })
            });
            
            clearInput();
            fetchOrders();
        }

        async function moveToReady(orderNum) {
            await fetch(`/api/orders/${orderNum}/ready`, { method: 'PUT' });
            fetchOrders();
        }

        async function removeOrder(orderNum) {
            await fetch(`/api/orders/${orderNum}`, { method: 'DELETE' });
            fetchOrders();
        }

        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const data = await res.json();
                
                isPosConnected = data.pos_connected;
                posOverlay.style.display = isPosConnected ? 'flex' : 'none';
                
                // Render preparing list
                preparingGrid.innerHTML = '';
                data.preparing.forEach(order => {
                    const btn = document.createElement('button');
                    btn.className = 'order-btn preparing-btn';
                    btn.textContent = order;
                    btn.onclick = () => moveToReady(order);
                    preparingGrid.appendChild(btn);
                });

                // Render ready list
                readyGrid.innerHTML = '';
                data.ready.forEach(order => {
                    const btn = document.createElement('button');
                    btn.className = 'order-btn ready-btn';
                    btn.textContent = order;
                    btn.onclick = () => removeOrder(order);
                    readyGrid.appendChild(btn);
                });
            } catch (e) {
                console.error("Connection lost...", e);
            }
        }

        setInterval(fetchOrders, 2000);
        fetchOrders();
    </script>
</body>
</html>
